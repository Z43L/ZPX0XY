function renderMarkdown(value){
 const inline=value=>{let out=esc(value);const code=[];out=out.replace(/`([^`]+)`/g,(_,x)=>{code.push('<code>'+x+'</code>');return '\u0000'+(code.length-1)+'\u0000'});out=out.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,(_,label,url)=>'<a href="'+url+'" target="_blank" rel="noopener noreferrer">'+label+'</a>');out=out.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/__([^_]+)__/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>').replace(/~~([^~]+)~~/g,'<del>$1</del>');return out.replace(/\u0000(\d+)\u0000/g,(_,i)=>code[Number(i)])};
 const lines=String(value??'').replace(/\r\n?/g,'\n').split('\n'),blocks=[];let paragraph=[],list=[],quote=[],code=null;
 const flushParagraph=()=>{if(paragraph.length){blocks.push('<p>'+inline(paragraph.join('\n')).replace(/\n/g,'<br>')+'</p>');paragraph=[]}};
 const flushList=()=>{if(list.length){const ordered=/^\d+\./.test(list[0]);blocks.push('<'+(ordered?'ol':'ul')+'>'+list.map(x=>'<li>'+inline(x.replace(/^(?:[-*+]\s+|\d+\.\s+)/,'').trim())+'</li>').join('')+'</'+(ordered?'ol':'ul')+'>');list=[]}};
 const flushQuote=()=>{if(quote.length){blocks.push('<blockquote>'+quote.map(x=>'<p>'+inline(x)+'</p>').join('')+'</blockquote>');quote=[]}};
 const splitRow=line=>line.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(x=>x.trim());
 const isTableRule=line=>/^\s*\|?\s*:?-{3,}:?\s*(?:\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(line);
 for(let i=0;i<lines.length;i++){

 }

}

tton class="btn primary" id="send">Enviar</button></div><div class="split"><div><h3>Headers JSON</h3><textarea id="headers" class="editor" spellcheck="false"></textarea><h3>Body</h3><textarea id="body" class="editor"></textarea></div><div><div class="repeater-response-head"><h3>Respuesta</h3><label class="repeater-follow"><input id="follow" type="checkbox">Seguir redirecciones</label><button class="btn" id="analyze" style="display:none">Analizar en AI Lab</button></div><p class="repeater-note">Cada salto se guarda en HTTP history. Se quitan credenciales y cookies al cambiar de origen; solo se sigue si el destino está en Scope.</p><pre id="repeatResult" class="code repeater-response">La respuesta se conservará en esta pestaña.</pre></div></div></section>';const capture=()=>{const t=cur();t.method=$('#method').value;t.url=$('#url').value;t.body=$('#body').value;t.follow=$('#follow').checked;try{t.headers=JSON.parse($('#headers').value||'{}')}catch{}};const label=t=>{try{const u=new URL(t.url);return (t.method||'GET')+' '+u.hostname+(u.pathname||'/')+u.search}catch{return (t.method||'GET')+' · Nueva'}};const drawTabs=()=>{$('#repeatTabs').innerHTML=tabs.map(t=>'<div class="repeater-tab '+(t.id===active?'active':'')+'"><button class="repeater-tab-name" data-pick="'+esc(t.id)+'">'+esc(label(t))+'</button><button class="repeater-tab-close" data-x="'+esc(t.id)+'">×</button></div>').join('');$('#repeatTabs').querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{capture();save();active=b.dataset.pick;draw()});$('#repeatTabs').querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{tabs=tabs.filter(t=>t.id!==b.dataset.x);if(!tabs.length)tabs=[make(null)];if(!tabs.some(t=>t.id===active))active=tabs[0].id;save();draw()})};const draw=()=>{const t=cur();$('#method').value=t.method;$('#url').value=t.url;$('#headers').value=JSON.stringify(t.headers||{},null,2);$('#body').value=t.body||'';$('#follow').checked=!!t.follow;$('#repeatResult').textContent=t.result?JSON.stringify(t.res thod:x.method,url:x.url,request_headers:x.request_headers,request_body:x.request_body},response:{status:x.status,headers:x.response_headers,body:x.response_body}})});$('#aiAnalysis').textContent=d.analysis}catch(e){$('#aiAnalysis').textContent=e.message}};$('#aiCompose').onclick=async()=>{try{if(!$('#ollamaModel').value)throw Error('Choose and save an Ollama model first');$('#aiDraft').textContent='Preparing a draft…';const d=await api('/api/ai/compose',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:$('#ollamaModel').value,task:$('#aiTask').value})});window.aiRequestDraft=d.request;$('#aiDraft').textContent=JSON.stringify(d.request,null,2);$('#aiUseDraft').disabled=false}catch(e){$('#aiDraft').textContent=e.message}};$('#aiUseDraft').onclick=()=>{if(!window.aiRequestDraft)return;const r=window.aiRequestDraft;selected={method:r.method,url:r.url,request_headers:r.headers||{},request_body:r.body||''};openPage('repeater')};return}
if(page==='extensions'){const items=await api('/api/extensions');v.innerHTML=`<section class="panel"><h2>Extensiones integradas</h2><p class="muted">Módulos nativos inspirados en utilidades del ecosistema Burp. Puedes activarlos o desactivarlos; no son archivos BApp ni ejecutan código de terceros.</p>${items.map(x=>`<article class="card"><div class="cardhead"><div><b>${esc(x.name)}</b> <span class="pill">${esc(x.kind)} · v${esc(x.version)}</span></div><span class="spacer"></span><label><input type="checkbox" data-ext-toggle="${esc(x.id)}" ${x.enabled?'checked':''}> Activada</label>${x.enabled?`<button class="btn primary" data-ext-open="${esc(x.id)}">Abrir</button>`:''}</div><p class="muted">${esc(x.description)}</p></article>`).join('')}<h2 style="margin-top:24px">Inspector de paquetes Burp</h2><p class="muted">Analiza un .jar o .bapp de hasta 10 MiB sin ejecutarlo. Detecta referencias API para planificar adaptadores; no significa compatibilidad binaria.</p><div class="rowtools"><input id="extensionFile" type="file" accept=".jar,.bapp,application/java-archive" class="input" style="flex:1"><button id="inspectExtension" class="btn">Inspeccionar paquete</button></div><div id="extensionResult"></div></section>`;v.querySelectorAll('[data-ext-toggle]').forEach(c=>c.onchange=async()=>{try{await api('/api/extensions/toggle',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:c.dataset.extToggle,enabled:c.checked})});render()}catch(e){toast(e.message)}});v.querySelectorAll('[data-ext-open]').forEach(b=>b.onclick=()=>openPage(({ 'jwt-inspector':'jwt','content-converter':'converter','passive-auditor':'discover','cookie-inspector':'cookies','endpoint-extractor':'endpoints','secret-detector':'secrets'})[b.dataset.extOpen]||'extensions'));$('#inspectExtension').onclick=async()=>{try{const file=$('#extensionFile').files[0];if(!file)throw Error('Selecciona un .jar o .bapp');if(file.size>10*1024*1024)throw Error('El límite de inspección es 10 MiB');$('#extensionResult').innerHTML='<article class="card">Inspeccionando…</article>';const bytes=new Uint8Array(await file.arrayBuffer());let binary='';for(let i=0;i<bytes.length;i+=0x8000)binary+=String.fromCharCode(...bytes.subarray(i,i+0x8000));const result=await api('/api/extensions/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:file.name,archive:btoa(binary)})});$('#extensionResult').innerHTML=`<article class="card"><b>${esc(result.filename)}</b><p>${result.classCount} clases · ${esc(result.runtime)} · ${esc(result.execution)}</p><p>APIs: ${result.apis.map(esc).join(' · ')||'No reconocidas'}</p><p>Áreas: ${result.modules.map(esc).join(' · ')||'Ninguna'}</p><p>${esc(result.compatibility)}</p></article>`}catch(e){$('#extensionResult').innerHTML=`<article class="card">${esc(e.message)}</article>`}};return}
if(page==='jwt'){const items=await api('/api/extensions');if(!items.find(x=>x.id==='jwt-inspector')?.enabled){v.innerHTML=blank('◇','JWT Inspector desactivado','Actívalo desde Extensions.');return}v.innerHTML=`<section class="panel"><h2>JWT Inspector</h2><p class="muted">Decodifica localmente el encabezado y los claims de un JWT. No comprueba la firma, no intenta claves y no envía tráfico.</p><textarea id="jwtToken" class="editor" placeholder="Pega un JWT (eyJ…)"></textarea><div class="rowtools"><button id="jwtDecode" class="btn primary">Decodificar</button><button id="jwtFromRequest" class="btn">Tomar Authorization del historial</button></div><div class="split"><div><h3>Header</h3><pre id="jwtHeader" class="code"></pre></div><div><h3>Claims</h3><pre id="jwtClaims" class="code"></pre></div></div><p id="jwtStatus" class="muted">La firma no ha sido verificada.</p></section>`;$('#jwtDecode').onclick=()=>{try{let t=$('#jwtToken').value.trim().replace(/^Bearer\s+/i,'').split('.');if(t.length!==3)throw Error('El valor no tiene las tres partes de un JWT');const decode=x=>{let b=x.replace(/-/g,'+').replace(/_/g,'/');b+='='.repeat((4-b.length%4)%4);const bytes=Uint8Array.from(atob(b),c=>c.charCodeAt(0));return new TextDecoder().decode(bytes)};$('#jwtHeader').textContent=JSON.stringify(JSON.parse(decode(t[0])),null,2);$('#jwtClaims').textContent=JSON.stringify(JSON.parse(decode(t[1])),null,2);$('#jwtStatus').textContent=`JWT decodificado localmente · firma no verificada · segmento de firma: ${t[2].length} caracteres`}catch(e){$('#jwtStatus').textContent=e.message;$('#jwtHeader').textContent='';$('#jwtClaims').textContent=''}};$('#jwtFromRequest').onclick=async()=>{try{const reqs=await api('/api/requests');const rows=reqs.filter(r=>Object.keys(r.request_headers||{}).some(k=>k.toLowerCase()==='authorization'));if(!rows.length)throw Error('No hay Authorization en el historial');const r=rows[0],h=Object.entries(r.request_headers).find(([k])=>k.toLowerCase()==='authorization');$('#jwtToken').value=h[1];toast(`Token de ${r.host}; analiza solo datos autorizados`)}catch(e){toast(e.message)}};return}
if(page==='converter'){const items=await api('/api/extensions');if(!items.find(x=>x.id==='content-converter')?.enabled){v.innerHTML=blank('◇','Conversor desactivado','Actívalo desde Extensions.');return}v.innerHTML=`<section class="panel"><h2>Content Type Converter</h2><p class="muted">Convierte contenido en el editor local. No genera ni envía solicitudes.</p><div class="rowtools"><label>Entrada <select id="convIn"><option>JSON</option><option>XML</option><option>Form URL-encoded</option></select></label><label>Salida <select id="convOut"><option>XML</option><option>JSON</option><option>Form URL-encoded</option></select></label><button id="convert" class="btn primary">Convertir</button></div><div class="split"><textarea id="convSrc" class="editor" placeholder="Contenido de entrada"></textarea><pre id="convDst" class="code" style="min-height:190px"></pre></div><div id="convError" class="muted"></div></section>`;$('#convert').onclick=()=>{try{const src=$('#convSrc').value,from=$('#convIn').value,to=$('#convOut').value;let obj;if(from==='JSON')obj=JSON.parse(src);else if(from==='Form URL-encoded'){obj={};for(const [k,val] of new URLSearchParams(src)){obj[k]===undefined?obj[k]=val:Array.isArray(obj[k])?obj[k].push(val):obj[k]=[obj[k],val]}}else{if(/<!DOCTYPE|<!ENTITY/i.test(src))throw Error('XML con DTD o entidades no permitidas');const doc=new DOMParser().parseFromString(src,'application/xml');if(doc.querySelector('parsererror'))throw Error('XML no válido');const read=e=>{let o={};for(const a of e.attributes)o['@'+a.name]=a.value;for(const c of e.children){const val=read(c);if(o[c.tagName]===undefined)o[c.tagName]=val;else if(Array.isArray(o[c.tagName]))o[c.tagName].push(val);else o[c.tagName]=[o[c.tagName],val]}const text=[...e.childNodes].filter(n=>n.nodeType===3).map(n=>n.nodeValue.trim()).filter(Boolean).join(' ');if(text)o['#text']=text;return Object.keys(o).length?o:text};obj={[doc.documentElement.tagName]:read(doc.documentElement)}};let result;if(to==='JSON')result=JSON.stringify(obj,null,2);else if(to==='Form URL-encoded'){const p=new URLSearchParams();for(const [k,val] of Object.entries(obj||{}))p.append(k,typeof val==='string'?val:JSON.stringify(val));result=p.toString()}else{const escXml=x=>String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');const tag=k=>/^[A-Za-z_][\w.-]*$/.test(k)?k:'item';const emit=(k,val)=>Array.isArray(val)?val.map(x=>emit(k,x)).join(''):val&&typeof val==='object'?`<${tag(k)}>${Object.entries(val).map(([a,b])=>emit(a,b)).join('')}</${tag(k)}>`:`<${tag(k)}>${escXml(val??'')}</${tag(k)}>`;result=emit('root',obj)}$('#convDst').textContent=result;$('#convError').textContent='Conversión local completada.'}catch(e){$('#convDst').textContent='';$('#convError').textContent=e.message}};return}
